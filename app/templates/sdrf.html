<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>APSDRF - Andhra Pradesh Special Police</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=17">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}?v=17">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		.logo {
			width: 80px !important;
			height: 80px !important;
			object-fit: cover;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: crisp-edges;
			border-radius: 50%;
			padding: 0px;
			object-position: center;
			background-color: transparent;
		}

		.sdrf-container {
			max-width: 1750px !important;
			width: 95% !important;
			margin: 0 auto;
			padding: 30px 20px;
			min-height: calc(100vh - 500px);
		}

		.sdrf-header {
			background: linear-gradient(135deg, #cc0000, #990000);
			color: white;
			padding: 50px 30px;
			border-radius: 12px;
			margin-bottom: 40px;
			text-align: center;
			box-shadow: 0 4px 20px rgba(204, 0, 0, 0.3);
		}

		.sdrf-header h1 {
			font-size: 36px;
			margin-bottom: 15px;
			font-weight: 700;
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
		}

		.sdrf-header p {
			font-size: 18px;
			opacity: 0.95;
		}

		.section {
			background: white;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
			margin-bottom: 30px;
		}

		.section h2 {
			color: #cc0000;
			font-size: 28px;
			margin-bottom: 20px;
			border-bottom: 3px solid #cc0000;
			padding-bottom: 12px;
		}

		.section h3 {
			color: #003d82;
			font-size: 22px;
			margin-top: 25px;
			margin-bottom: 15px;
		}

		.section p {
			line-height: 1.8;
			color: #444;
			margin-bottom: 15px;
			text-align: justify;
		}

		.section ul {
			margin-left: 25px;
			margin-bottom: 20px;
		}

		.section ul li {
			line-height: 1.8;
			color: #444;
			margin-bottom: 12px;
		}

		.gallery-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 25px;
			margin-top: 25px;
		}

		.gallery-item {
			position: relative;
			overflow: hidden;
			border-radius: 10px;
			box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
			transition: transform 0.3s, box-shadow 0.3s;
		}

		.gallery-item:hover {
			transform: translateY(-5px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
		}

		.gallery-item img {
			width: 100%;
			height: 220px;
			object-fit: cover;
			display: block;
		}

		.gallery-caption {
			background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.7));
			color: white;
			padding: 15px;
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
		}

		.gallery-caption h4 {
			margin: 0 0 5px 0;
			font-size: 16px;
		}

		.gallery-caption p {
			margin: 0;
			font-size: 13px;
			opacity: 0.9;
			color: white;
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 20px;
			margin: 25px 0;
		}

		.stat-card {
			background: linear-gradient(135deg, #cc0000, #990000);
			color: white;
			padding: 25px;
			border-radius: 10px;
			text-align: center;
			box-shadow: 0 3px 10px rgba(204, 0, 0, 0.2);
		}

		.stat-card .number {
			font-size: 42px;
			font-weight: 700;
			margin-bottom: 10px;
		}

		.stat-card .label {
			font-size: 15px;
			opacity: 0.95;
		}

		.timeline {
			position: relative;
			padding-left: 40px;
			margin: 30px 0;
		}

		.timeline::before {
			content: '';
			position: absolute;
			left: 0;
			top: 0;
			bottom: 0;
			width: 3px;
			background: #cc0000;
		}

		.timeline-item {
			position: relative;
			margin-bottom: 30px;
			padding-left: 30px;
		}

		.timeline-item::before {
			content: '';
			position: absolute;
			left: -47px;
			top: 5px;
			width: 15px;
			height: 15px;
			border-radius: 50%;
			background: #cc0000;
			border: 3px solid white;
			box-shadow: 0 0 0 3px #cc0000;
		}

		.timeline-item h4 {
			color: #cc0000;
			font-size: 18px;
			margin-bottom: 8px;
		}

		.timeline-item p {
			margin-bottom: 5px;
		}

		@media (max-width: 768px) {
			.sdrf-header h1 {
				font-size: 28px;
			}

			.section {
				padding: 25px;
			}

			.gallery-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>

<body>
	{% include 'includes/header.html' %}

	<div class="sdrf-container">

		<!-- About Section -->
		<div class="section">
			<h2><i class="fas fa-info-circle"></i> About APSDRF</h2>

			{% if sdrf_content and sdrf_content.about_pdf %}
			<div style="width: 100%; height: 800px; margin-bottom: 20px;">
				<embed src="{{ url_for('static', filename=sdrf_content.about_pdf) }}#toolbar=0&navpanes=0&scrollbar=0"
					type="application/pdf" width="100%" height="100%">
			</div>
			{% else %}
			<div class="alert alert-info">
				Content is being updated. Please check back later.
			</div>
			{% endif %}
		</div>

	</div>

	{% include 'includes/footer.html' %}

	<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
