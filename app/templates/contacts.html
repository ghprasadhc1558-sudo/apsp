<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - APSP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=17">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}?v=17">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .logo {
            width: 80px !important;
            height: 80px !important;
            object-fit: cover;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            border-radius: 50%;
            padding: 0px;
            object-position: center;
            background-color: transparent;
        }

        .page-header {
            background: linear-gradient(135deg, #003d82 0%, #00275a 100%);
            color: white;
            padding: 60px 0;
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .page-header p {
            font-size: 1.1rem;
            margin-top: 10px;
            opacity: 0.9;
        }

        .contact-section {
            padding: 50px 0;
            background: #f5f5f5;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .contact-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .contact-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #003d82, #006644);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        .contact-card h3 {
            color: #003d82;
            margin-bottom: 15px;
        }

        .contact-card p {
            color: #666;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    {% include 'includes/header.html' %}

    <section class="contact-section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <h3>Head Office</h3>
                    <p id="office-address-display">Loading...</p>
                </div>
                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-phone"></i></div>
                    <h3>Phone</h3>
                    <p id="phone-numbers-display">Loading...</p>
                </div>
                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                    <h3>Email</h3>
                    <p id="email-addresses-display">Loading...</p>
                </div>
            </div>
        </div>
    </section>

    {% include 'includes/footer.html' %}

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        // Load contact information dynamically
        async function loadContactInfo() {
            try {
                const response = await fetch('/api/contacts');
                const data = await response.json();

                // Display office address
                const officeEl = document.getElementById('office-address-display');
                officeEl.innerHTML = data.office_address.replace(/\n/g, '<br>');

                // Display phone numbers
                const phoneEl = document.getElementById('phone-numbers-display');
                if (data.phone_numbers && data.phone_numbers.length > 0) {
                    phoneEl.innerHTML = data.phone_numbers.join('<br>');
                } else {
                    phoneEl.innerHTML = 'Contact information not available';
                }

                // Display email addresses
                const emailEl = document.getElementById('email-addresses-display');
                if (data.email_addresses && data.email_addresses.length > 0) {
                    emailEl.innerHTML = data.email_addresses.join('<br>');
                } else {
                    emailEl.innerHTML = 'Email not available';
                }
            } catch (error) {
                console.error('Error loading contact info:', error);
                document.getElementById('office-address-display').innerHTML = 'APSP Headquarters<br>Vijayawada, Andhra Pradesh<br>PIN: 520001';
                document.getElementById('phone-numbers-display').innerHTML = '+91-866-2434567<br>100 (Emergency)<br>+91-866-2434890';
                document.getElementById('email-addresses-display').innerHTML = 'info@apsp.ap.gov.in<br>dgapsp@ap.gov.in<br>complaints@apsp.ap.gov.in';
            }
        }

        // Load contact info when page loads
        document.addEventListener('DOMContentLoaded', loadContactInfo);
    </script>
</body>

</html>
