<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <style>
      .title-box { fill: #8BC34A; stroke: #000; stroke-width: 2; }
      .dig-box { fill: #FFEB3B; stroke: #000; stroke-width: 2; }
      .bn-box { fill: #FFFFFF; stroke: #000; stroke-width: 2; }
      .text-main { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000; text-anchor: middle; }
      .text-sub { font-family: Arial, sans-serif; font-size: 14px; fill: #000; text-anchor: middle; }
      .line { stroke: #000; stroke-width: 2; fill: none; }
    </style>
  </defs>
  
  <!-- Top Level - ADGP -->
  <rect x="400" y="20" width="400" height="60" class="title-box" rx="5"/>
  <text x="600" y="45" class="text-main">ADGP/IGP, APSP Bns,</text>
  <text x="600" y="65" class="text-main">Mangalagiri</text>
  
  <!-- Lines from ADGP to DIGs -->
  <line x1="600" y1="80" x2="600" y2="120" class="line"/>
  <line x1="300" y1="120" x2="900" y2="120" class="line"/>
  <line x1="300" y1="120" x2="300" y2="160" class="line"/>
  <line x1="900" y1="120" x2="900" y2="160" class="line"/>
  
  <!-- DIG-I Mangalagiri -->
  <rect x="100" y="160" width="400" height="50" class="dig-box" rx="5"/>
  <text x="300" y="192" class="text-main">DIG-I, Mangalagiri</text>
  
  <!-- DIG-II Kurnool -->
  <rect x="700" y="160" width="400" height="50" class="dig-box" rx="5"/>
  <text x="900" y="192" class="text-main">DIG-II, Kurnool</text>
  
  <!-- Lines from DIG-I to battalions -->
  <line x1="300" y1="210" x2="300" y2="250" class="line"/>
  
  <!-- DIG-I Battalions -->
  <g id="dig1-battalions">
    <!-- 1st Battalion -->
    <rect x="50" y="270" width="160" height="45" class="bn-box" rx="3"/>
    <text x="130" y="288" class="text-sub">1st (IR) Bn APSP,</text>
    <text x="130" y="305" class="text-sub">Etcherla</text>
    
    <!-- 3rd Battalion -->
    <rect x="50" y="330" width="160" height="45" class="bn-box" rx="3"/>
    <text x="130" y="348" class="text-sub">3rd Bn APSP,</text>
    <text x="130" y="365" class="text-sub">Kakinada</text>
    
    <!-- 4th Battalion -->
    <rect x="50" y="390" width="160" height="45" class="bn-box" rx="3"/>
    <text x="130" y="408" class="text-sub">4th IR Bn APSP,</text>
    <text x="130" y="425" class="text-sub">Rajahmundry</text>
    
    <!-- 5th Battalion -->
    <rect x="50" y="450" width="160" height="45" class="bn-box" rx="3"/>
    <text x="130" y="468" class="text-sub">5th Bn APSP,</text>
    <text x="130" y="485" class="text-sub">Vizianagaram</text>
    
    <!-- 6th Battalion -->
    <rect x="230" y="270" width="160" height="45" class="bn-box" rx="3"/>
    <text x="310" y="288" class="text-sub">6th Bn APSP,</text>
    <text x="310" y="305" class="text-sub">Mangalagiri</text>
    
    <!-- 7th Battalion -->
    <rect x="230" y="330" width="160" height="45" class="bn-box" rx="3"/>
    <text x="310" y="348" class="text-sub">7th IR Bn APSP,</text>
    <text x="310" y="365" class="text-sub">Maddipadu</text>
    
    <!-- 16th Battalion -->
    <rect x="230" y="390" width="160" height="45" class="bn-box" rx="3"/>
    <text x="310" y="408" class="text-sub">16th Bn APSP,</text>
    <text x="310" y="425" class="text-sub">Visakhapatnam</text>
  </g>
  
  <!-- Lines from DIG-II to battalions -->
  <line x1="900" y1="210" x2="900" y2="250" class="line"/>
  
  <!-- DIG-II Battalions -->
  <g id="dig2-battalions">
    <!-- 2nd Battalion -->
    <rect x="650" y="270" width="160" height="45" class="bn-box" rx="3"/>
    <text x="730" y="288" class="text-sub">2nd Bn APSP,</text>
    <text x="730" y="305" class="text-sub">Kurnool</text>
    
    <!-- 8th Battalion -->
    <rect x="650" y="330" width="160" height="45" class="bn-box" rx="3"/>
    <text x="730" y="348" class="text-sub">8th IR Bn APSP,</text>
    <text x="730" y="365" class="text-sub">Chittoor</text>
    
    <!-- 9th Battalion -->
    <rect x="650" y="390" width="160" height="45" class="bn-box" rx="3"/>
    <text x="730" y="408" class="text-sub">9th Bn APSP,</text>
    <text x="730" y="425" class="text-sub">Venkatagiri</text>
    
    <!-- 11th Battalion -->
    <rect x="650" y="450" width="160" height="45" class="bn-box" rx="3"/>
    <text x="730" y="468" class="text-sub">11th Bn APSP,</text>
    <text x="730" y="485" class="text-sub">Kadapa</text>
    
    <!-- 14th Battalion -->
    <rect x="830" y="270" width="160" height="45" class="bn-box" rx="3"/>
    <text x="910" y="288" class="text-sub">14th Bn APSP,</text>
    <text x="910" y="305" class="text-sub">Ananthapuram</text>
    
    <!-- SAR CPL -->
    <rect x="830" y="330" width="160" height="45" class="bn-box" rx="3"/>
    <text x="910" y="348" class="text-sub">SAR CPL.</text>
    <text x="910" y="365" class="text-sub">AP Unit</text>
  </g>
  
  <!-- Connection lines for DIG-I battalions -->
  <line x1="50" y1="250" x2="390" y2="250" class="line"/>
  <line x1="130" y1="250" x2="130" y2="270" class="line"/>
  <line x1="130" y1="250" x2="130" y2="330" class="line"/>
  <line x1="130" y1="250" x2="130" y2="390" class="line"/>
  <line x1="130" y1="250" x2="130" y2="450" class="line"/>
  <line x1="310" y1="250" x2="310" y2="270" class="line"/>
  <line x1="310" y1="250" x2="310" y2="330" class="line"/>
  <line x1="310" y1="250" x2="310" y2="390" class="line"/>
  
  <!-- Connection lines for DIG-II battalions -->
  <line x1="650" y1="250" x2="990" y2="250" class="line"/>
  <line x1="730" y1="250" x2="730" y2="270" class="line"/>
  <line x1="730" y1="250" x2="730" y2="330" class="line"/>
  <line x1="730" y1="250" x2="730" y2="390" class="line"/>
  <line x1="730" y1="250" x2="730" y2="450" class="line"/>
  <line x1="910" y1="250" x2="910" y2="270" class="line"/>
  <line x1="910" y1="250" x2="910" y2="330" class="line"/>
</svg>
